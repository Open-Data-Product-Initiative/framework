schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: '1.0'
kind: Recipe
recipe:
  metadata:
    id: RCP-CUSTOMER-360-VALIDATE
    name:
      en: Validate Customer 360 release artifacts
    description:
      en: Validate the proposed Customer 360 product definition before the external human approval gate.
    owner: Customer Data Products
    tags:
      - customer-360
      - validation
  version: '1.0.0'
  type: release
  steps:
    - id: validate-product-contract
      command: validate
      with:
        document: product.odps.yaml
    - id: validate-relationship-graph
      command: validate
      with:
        document: relationships.odpg.yaml
