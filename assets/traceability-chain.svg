    <g transform="translate(1110 480)"><circle r="45" fill="#bd5b0b"/><path d="M-22-3h44M-13-16l-13 13 13 13M13-16 26-3 13 10M0-25v44" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text y="74" fill="#1e0a2e" font-size="18" font-weight="700">Consumption</text></g>
