<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Bidirectional framework traceability chain</title>
  <desc id="desc">A continuous path connects objective, use case, product decision, data product, contract, delivery, consumption, evidence, outcome, value and investment decision, with evidence returning to the original objective.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#173b67"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1e0a2e" flood-opacity=".12"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="658" rx="18" fill="#fbf9fc" stroke="#ddd4e2"/>
  <path d="M84 174H1110V480H290" fill="none" stroke="#dce6ee" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M84 174H1080" fill="none" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1110 204V450" fill="none" stroke="#bd5b0b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1080 480H322" fill="none" stroke="#55409a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M290 515C290 590 84 590 84 205" fill="none" stroke="#6c2a8e" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/>
  <text x="72" y="72" fill="#166698" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">INTENT AND COMMITMENTS</text>
  <text x="72" y="600" fill="#55409a" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">EVIDENCE, VALUE AND DECISION</text>
  <g filter="url(#shadow)" font-family="Arial,sans-serif" text-anchor="middle">
