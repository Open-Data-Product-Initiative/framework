    <g transform="translate(288 174)"><circle r="45" fill="#166698"/><circle cx="-12" cy="-9" r="8" fill="#fff"/><circle cx="12" cy="-9" r="8" fill="#fff"/><path d="M-29 19c2-15 11-22 17-22S3 4 5 19M-5 19c2-15 11-22 17-22s15 7 17 22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text y="74" fill="#1e0a2e" font-size="18" font-weight="700">Use case</text></g>
    <g transform="translate(492 174)"><circle r="45" fill="#166698"/><path d="M-20-1l13 13 28-31" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text y="70" fill="#1e0a2e" font-size="17" font-weight="700"><tspan x="0">Product</tspan><tspan x="0" dy="20">decision</tspan></text></g>
    <g transform="translate(696 174)"><circle r="45" fill="#13745f"/><path d="M0-24 23-12 0 0-23-12zM-23-12V14L0 27l23-13v-26M0 0v27" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><text y="70" fill="#1e0a2e" font-size="17" font-weight="700"><tspan x="0">Data</tspan><tspan x="0" dy="20">product</tspan></text></g>
