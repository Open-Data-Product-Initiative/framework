  </g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#6e6276"><rect x="730" y="565" width="398" height="42" rx="21" fill="#eee6f3"/><text x="929" y="591" text-anchor="middle">Backward traceability tests every value claim</text></g>
